name: Verify Renju Master
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renju-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check rules.js
          node --check engine.worker.js
          node --check openings.js
      - name: Check rules and tactical analysis
        run: node verify.cjs
      - name: Check metadata files
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          for path in ('index.html','style.css','app.js','rules.js','engine.worker.js','openings.js','assets/ogp.jpg','assets/favicon.svg'):
              assert Path(path).is_file(), path
          PY
